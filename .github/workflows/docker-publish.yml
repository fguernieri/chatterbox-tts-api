name: Docker Build & Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite rodar manualmente se precisar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          # Usando exatamente os nomes que você criou nos Secrets
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push para o Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.gpu
          push: true
          # Aqui ele pega seu usuário automaticamente do secret para nomear a imagem
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatterbox-tts-api:latest
